<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#FF5733">
<title>Flex Flow – Prototipo Interactivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --coral: #FF5733;
    --coral-light: #FAECE7;
    --coral-dark: #D94425;
    --green: #1D9E75;
    --green-light: #E1F5EE;
    --warn: #BA7517;
    --red: #E24B4A;
    --bg: #FFFFFF;
    --bg-secondary: #F5F5F7;
    --text-primary: #1D1D1F;
    --text-secondary: #6E6E73;
    --text-tertiary: #AEAEB2;
    --border: #E5E5EA;
    --border-light: #F2F2F7;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: var(--font);
    background: var(--bg);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* iPhone frame hidden in PWA — runs natively */
  .iphone-frame {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    background: var(--bg);
    border-radius: 0;
    padding: 0;
    position: relative;
    box-shadow: none;
  }

  .iphone-screen {
    width: 100%;
    height: 100%;
    background: var(--bg);
    border-radius: 0;
    overflow: hidden;
    position: relative;
  }

  /* Dynamic Island hidden — real phone has its own */
  .dynamic-island { display: none; }

  /* Status Bar — use safe area on real devices */
  .status-bar {
    height: calc(env(safe-area-inset-top, 20px) + 36px);
    padding-top: env(safe-area-inset-top, 20px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-left: 32px;
    padding-right: 32px;
    padding-bottom: 8px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    position: relative;
    z-index: 50;
  }

  .status-bar-right {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  /* Screen Content Area */
  .screen-area {
    height: calc(100% - 59px - 34px);
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    position: relative;
  }

  .screen-area::-webkit-scrollbar { display: none; }

  .screen-content {
    padding: 0 20px 20px;
    opacity: 0;
    transform: translateX(40px);
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .screen-content.active {
    opacity: 1;
    transform: translateX(0);
  }

  .screen-content.exit-left {
    opacity: 0;
    transform: translateX(-40px);
  }

  /* Home Indicator */
  .home-indicator {
    height: calc(env(safe-area-inset-bottom, 8px) + 26px);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 8px;
  }

  .home-indicator-bar {
    width: 134px;
    height: 5px;
    background: var(--text-primary);
    border-radius: 3px;
    opacity: 0.2;
  }

  /* Navigation Header */
  .nav-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
    cursor: pointer;
  }

  .nav-header:active { opacity: 0.6; }

  .nav-header svg { transition: transform 0.2s; }
  .nav-header:active svg { transform: translateX(-3px); }

  .nav-title {
    font-weight: 500;
    font-size: 16px;
    color: var(--text-primary);
  }

  /* Quick Action Buttons */
  .quick-actions {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }

  .quick-action {
    flex: 1;
    background: var(--bg-secondary);
    border-radius: var(--radius-md);
    padding: 12px 10px;
    text-align: center;
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
    border: none;
    font-family: var(--font);
  }

  .quick-action:active {
    transform: scale(0.95);
    background: #EDEDF0;
  }

  .quick-action svg {
    display: block;
    margin: 0 auto 4px;
  }

  /* Transaction Row */
  .tx-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 0.5px solid var(--border-light);
    cursor: pointer;
    transition: all 0.15s;
  }

  .tx-row:active { opacity: 0.7; }

  .tx-row-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .tx-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--bg-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tx-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
  }

  .tx-date {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-top: 1px;
  }

  .tx-amount {
    font-size: 14px;
    font-weight: 500;
  }

  .tx-amount.negative { color: var(--red); }
  .tx-amount.positive { color: var(--green); }

  /* Highlighted transaction */
  .tx-row.highlighted {
    background: var(--coral-light);
    border-radius: var(--radius-md);
    padding: 12px 8px;
    margin: 0 -8px;
    border-bottom: none;
    position: relative;
  }

  .tx-row.highlighted .tx-icon {
    background: var(--bg);
  }

  .tx-row.highlighted::after {
    content: '';
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
  }

  /* CTA Button */
  .cta-btn {
    background: var(--coral);
    border-radius: var(--radius-lg);
    padding: 16px;
    text-align: center;
    font-weight: 500;
    font-size: 15px;
    color: #fff;
    cursor: pointer;
    border: none;
    width: 100%;
    font-family: var(--font);
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .cta-btn:active {
    transform: scale(0.97);
    background: var(--coral-dark);
  }

  .cta-btn.loading {
    pointer-events: none;
    color: transparent;
  }

  .cta-btn .spinner {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 22px;
    height: 22px;
    border: 2.5px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  .cta-btn.loading .spinner { display: block; }

  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

  /* Plan Card */
  .plan-card {
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
  }

  .plan-card:active { transform: scale(0.98); }

  .plan-card.selected {
    border: 2px solid var(--coral);
    padding: 13px 15px;
  }

  /* no checkmark on selected plan */

  .plan-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .plan-title {
    font-weight: 500;
    font-size: 15px;
    color: var(--text-primary);
  }

  .plan-subtitle {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  .plan-price {
    font-weight: 500;
    font-size: 16px;
    color: var(--text-primary);
    text-align: right;
  }

  .plan-price-label {
    font-size: 11px;
    color: var(--text-secondary);
    text-align: right;
  }

  /* Info Box */
  .info-box {
    background: var(--bg-secondary);
    border-radius: var(--radius-md);
    padding: 10px 14px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.5;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }

  .info-box svg { flex-shrink: 0; margin-top: 1px; }

  .info-box.coral-bg {
    background: var(--coral-light);
    color: #712B13;
  }

  /* Detail Row */
  .detail-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .detail-label {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .detail-value {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
  }

  /* Left border accent */
  .accent-box {
    border-left: 3px solid var(--coral);
    padding-left: 12px;
    margin-bottom: 16px;
  }

  .accent-box p {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  .accent-box strong {
    color: var(--text-primary);
  }

  /* Flex Banner */
  .flex-banner {
    background: var(--coral);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 16px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .flex-banner:active { transform: scale(0.98); }

  .flex-banner-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    font-weight: 500;
    font-size: 14px;
    color: #fff;
  }

  .flex-banner-text {
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    line-height: 1.5;
  }

  /* Success Circle */
  .success-circle {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
  }

  /* Progress bar */
  .progress-bar-track {
    height: 6px;
    background: var(--bg-secondary);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--coral);
    border-radius: 3px;
    transition: width 1s ease;
  }

  /* Payment row */
  .payment-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 0.5px solid var(--border-light);
  }

  .payment-row:last-child { border-bottom: none; }

  .payment-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
  }

  .payment-date {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 1px;
  }

  .payment-amount {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
  }

  /* Alert / Toast */
  .toast-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border-radius: 0;
  }

  .toast-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .alert-box {
    background: var(--bg);
    border-radius: 14px;
    width: 270px;
    overflow: hidden;
    transform: scale(0.85);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .toast-overlay.show .alert-box {
    transform: scale(1);
  }

  .alert-content {
    padding: 20px 16px 16px;
    text-align: center;
  }

  .alert-title {
    font-size: 17px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .alert-message {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.4;
  }

  .alert-actions {
    border-top: 0.5px solid var(--border);
    display: flex;
  }

  .alert-btn {
    flex: 1;
    padding: 12px;
    text-align: center;
    font-size: 17px;
    font-family: var(--font);
    color: #007AFF;
    cursor: pointer;
    border: none;
    background: none;
    transition: background 0.15s;
  }

  .alert-btn:active { background: rgba(0,0,0,0.05); }

  .alert-btn.bold { font-weight: 600; }

  .alert-btn + .alert-btn {
    border-left: 0.5px solid var(--border);
  }

  /* Step Progress Pills */
  .step-pills {
    display: flex;
    gap: 4px;
    justify-content: center;
    padding: 8px 20px 12px;
  }

  .step-pill {
    height: 3px;
    border-radius: 2px;
    flex: 1;
    background: var(--border);
    transition: all 0.4s;
    cursor: pointer;
  }

  .step-pill.active { background: var(--coral); }
  .step-pill.done { background: var(--coral); opacity: 0.4; }

  /* Confetti */
  .confetti-container {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    pointer-events: none;
    z-index: 90;
    overflow: hidden;
    border-radius: 0;
  }

  .confetti-piece {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    top: -10px;
    animation: confettiFall 2s ease-out forwards;
  }

  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translateY(700px) rotate(720deg) scale(0.3); opacity: 0; }
  }

  /* Haptic pulse animation */
  @keyframes hapticPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }

  .haptic { animation: hapticPulse 0.15s ease; }

  /* Responsive: on real phones, remove frame */
</style>
</head>

// ─── Navigation ───
function goTo(index, direction) {
  if (index < 0 || index >= totalScreens) return;
  const goingForward = direction !== undefined ? direction === 'forward' : index > currentScreen;
  
  // Animate out
  const currentContent = screenArea.querySelector('.screen-content');
  if (currentContent) {
    currentContent.classList.remove('active');
    if (goingForward) currentContent.classList.add('exit-left');
    currentContent.style.transform = goingForward ? 'translateX(-40px)' : 'translateX(40px)';
    currentContent.style.opacity = '0';
  }

  setTimeout(() => {
    currentScreen = index;
    renderScreen();
    renderPills();
  }, 200);
}

function renderScreen() {
  screenArea.innerHTML = `<div class="screen-content">${getScreenHTML(currentScreen)}</div>`;
  screenArea.scrollTop = 0;
  
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const content = screenArea.querySelector('.screen-content');
      if (content) content.classList.add('active');
    });
  });
}

function renderPills() {
  stepPills.innerHTML = Array.from({length: totalScreens}, (_, i) => {
    let cls = 'step-pill';
    if (i === currentScreen) cls += ' active';
    else if (i < currentScreen) cls += ' done';
    return `<div class="${cls}" onclick="goTo(${i})"></div>`;
  }).join('');
}

// ─── Plan Selection ───
function selectPlan(index) {
  selectedPlan = index;
  renderScreen();
  // Haptic feedback visual
  const cards = document.querySelectorAll('.plan-card');
  if (cards[index]) {
    cards[index].classList.add('haptic');
    setTimeout(() => cards[index].classList.remove('haptic'), 200);
  }
}

// ─── Confirm with loading ───
function handleConfirm() {
  showAlert(
    '¿Confirmar Flex?',
    `Se moverá tu compra de Apple Store ($3,000.00) a Flex con un plan de ${plans[selectedPlan].months} meses.`,
    [
      { label: 'Cancelar', bold: false, action: () => hideAlert() },
      { label: 'Confirmar', bold: true, action: () => {
        hideAlert();
        const btn = document.getElementById('confirmBtn');
        if (btn) {
          btn.classList.add('loading');
          setTimeout(() => {
            goTo(5, 'forward');
            setTimeout(() => {
              showToastNotif('Reembolso de $3,000.00 acreditado');
              launchConfetti();
              startAutoReturn();
            }, 500);
          }, 1500);
        }
      }}
    ]
  );
}

// ─── iOS Alert ───
function showAlert(title, message, actions) {
  document.getElementById('alertTitle').textContent = title;
  document.getElementById('alertMessage').textContent = message;
  const actionsDiv = document.getElementById('alertActions');
  actionsDiv.innerHTML = actions.map(a => 
    `<button class="alert-btn ${a.bold ? 'bold' : ''}">${a.label}</button>`
  ).join('');
  actionsDiv.querySelectorAll('.alert-btn').forEach((btn, i) => {
    btn.onclick = actions[i].action;
  });
  alertOverlay.classList.add('show');
}

function hideAlert() {
  alertOverlay.classList.remove('show');
}

// ─── Toast disabled ───
function showToastNotif(text) { /* removed */ }

// ─── Confetti ───
function launchConfetti() {
  const colors = [coral, green, '#FFD700', '#007AFF', coralLight];
  for (let i = 0; i < 40; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = Math.random() * 0.8 + 's';
    piece.style.animationDuration = (1.5 + Math.random()) + 's';
    piece.style.width = (5 + Math.random() * 6) + 'px';
    piece.style.height = (5 + Math.random() * 6) + 'px';
    confettiContainer.appendChild(piece);
  }
  setTimeout(() => { confettiContainer.innerHTML = ''; }, 3000);
}

// ─── Reset ───
function resetFlow() {
  selectedPlan = 0;
  currentScreen = 0;
  renderScreen();
  renderPills();
}

let autoReturnTimer = null;

function startAutoReturn() {
  clearTimeout(autoReturnTimer);
  autoReturnTimer = setTimeout(() => {
    if (currentScreen === 5) resetFlow();
  }, 8000);
}

// ─── Swipe gestures ───
let touchStartX = 0;
let touchStartY = 0;

document.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 60) {
    if (dx < 0 && currentScreen < totalScreens - 1) goTo(currentScreen + 1, 'forward');
    else if (dx > 0 && currentScreen > 0) goTo(currentScreen - 1, 'back');
  }
}, { passive: true });

// ─── Keyboard nav for desktop ───
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && currentScreen < totalScreens - 1) goTo(currentScreen + 1, 'forward');
  if (e.key === 'ArrowLeft' && currentScreen > 0) goTo(currentScreen - 1, 'back');
});

// ─── Init ───
renderScreen();
renderPills();

// ─── Register Service Worker ───
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
